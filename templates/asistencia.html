{% extends 'base.html' %}{% block content %}<header><small>CONTROL DE ACCESO</small><h1>Asistencia</h1></header><div class="cols"><div class="card"><h2>Marcar entrada</h2><form method="post"><label>Socio<select name="socio_id">{% for s in socios %}<option value="{{s.id}}">{{s.nombre}}</option>{% endfor %}</select></label><label>Fecha<input type="date" name="fecha" value="{{hoy}}"></label><label>Hora<input type="time" name="hora" value="{{hora}}"></label><button>Registrar asistencia</button></form></div><div class="card table"><table><tr><th>Socio</th><th>Fecha</th><th>Hora</th><th>Coach</th></tr>{% for r in rows %}<tr><td>{{r.socio}}</td><td>{{r.fecha}}</td><td>{{r.hora}}</td><td>{{r.coach}}</td></tr>{% else %}<tr><td colspan="4">Sin asistencias.</td></tr>{% endfor %}</table></div></div>{% endblock %}
